defaults:
  - model/pi0_5_pytorch_franka_shuo@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# Training config migrated from RealWorld-RLinf branch franka.
# Command:
#   bash examples/sft/run_vla_sft.sh franka_pi05_rlinf

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: pi05-recap-franka
    experiment_name: "sft_franka_shuo_pi05"
    logger_backends: ["tensorboard"]

  max_epochs: -1
  max_steps: 30000
  val_check_interval: -1
  save_interval: 1000
  resume_dir: null

data:
  # Same mix as Shuo's stage-1 command.
  # Replace these with local dataset paths before training.
  train_data_paths:
    - /path/to/FR3_A1/stack_bowls_in_size_order_rc
    - /path/to/FR3_A1/place_ring_on_rod_rc_0810
    - /path/to/FR3_A1/new_side/place_ring_on_rod_new_side_rc
  num_workers: 8

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  eval_batch_size: 1
  global_batch_size: 256
  seed: 42

  model:
    model_path: /path/to/pi05_base_openpi_rlinf
    openpi:
      assets_dir: /path/to/pi05_base_openpi_rlinf/assets
      asset_id: "franka_shuo_bowls_ring"
    openpi_data:
      asset_id: "franka_shuo_bowls_ring"
      norm_stats_path: /path/to/pi05_base_openpi_rlinf/assets/franka_shuo_bowls_ring/norm_stats.json

  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1e-10
    clip_grad: 1.0
    total_training_steps: 30000
    lr_warmup_steps: 1000
    lr_scheduler: "openpi_cosine"
    num_cycles: 0.5
    min_lr: 0.0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: True
    gradient_checkpointing: True
    gradient_checkpointing_use_reentrant: False
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: False

critic:
  use_critic_model: False
